<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Hotel</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo"><a class="landing" href="index.html">NATIONAL HOTEL</a></div>

            <nav>
                <ul class="nav-links">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="aboutus.html">About Us</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="booknow.html" class="book-btn">Book Now</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <!-- ABOUTUS SECTION -->
    <section class="booknow">
        <div class="overlay"></div> 
        <div class="gallery-content">
            <div class="alert alert-success" id="alertSuccess" role="alert">
                Booking save successfully!
            </div>
        <h1>BOOK NOW</h1> 
<form id="userForm">
                <!-- Name -->
                <div class="booknowform">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control" required>
                </div>

                <!-- Email -->
                <div class="booknowform">
                <label class="form-label">Email Address</label>
                <input type="email"id="email" class="form-control" required>
                </div>

                <!-- Phone -->
                <div class="booknowform">
                <label class="form-label">Phone Number</label>
                <input type="text" id="phone" class="form-control">
                </div>

                <!-- Date -->
                <div class="booknowform">
                <label class="form-label">Booking Date</label>
                <input type="date" id="date" class="form-control" required>
                </div>

                <!-- Time -->
                <div class="booknowform">
                <label class="form-label">Time</label>
                <input type="time" id="time" class="form-control">
                </div>

                <!-- Number of People -->
                <div class="booknowform">
                <label class="form-label">Number of Guests</label>
                <input type="number" id="guest" class="form-control" min="1" value="1" required>
                </div>

                <!-- Message -->
                <div class="booknowform">
                <label class="form-label">Additional Notes</label>
                <textarea class="form-control" id="notes" rows="3"></textarea>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-success w-100">Submit Booking</button>
                <button type="button" id="clear" class="btn btn-danger ms-2">Clear</button>
            </form>  
            <form id="confirmForm">
                <!-- Name -->
                <div class="mt-10">
                <label class="form-label">Full Name:</label>
                <label class="form-label" id="myFullName">Full Name</label>
                </div>

                <!-- Email -->
                <div class="mb-5">
                <label class="form-label">Email Address:</label>
                <label class="form-label" id="myEmail">Email Address</label>
                </div>

                <!-- Phone -->
                <div class="mb-5">
                <label class="form-label">Phone Number:</label>
                <label class="form-label" id="myPhone">Phone Number</label>
                </div>

                <!-- Date -->
                <div class="mb-3">
                <label class="form-label">Booking Date:</label>
                <label class="form-label" id="myDate">Booking Date</label>
                </div>

                <!-- Time -->
                <div class="mb-3">
                <label class="form-label">Time:</label>
                <label class="form-label" id="myTime">Time</label>
                </div>

                <!-- Number of People -->
                <div class="mb-3">
                <label class="form-label">Number of Guests:</label>
                <label class="form-label" id="myGuest">Number of Guests</label>
                </div>

                <!-- Message -->
                <div class="mb-3">
                <label class="form-label">Additional Notes:</label>
                <label class="form-label" id="myNotes">Additional Notes</label>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-success w-100">Confirm</button>
                <button type="button" id="clear_confirm" class="btn btn-danger ms-2">Clear</button>
            </form>     
        </div>
        </section>
<script>
  // Load saved data on page load
  $(document).ready(function () {
    $("#name").val(sessionStorage.getItem("name") || "");
    $("#email").val(sessionStorage.getItem("email") || "");
    $("#phone").val(sessionStorage.getItem("phone") || "");
    $("#date").val(sessionStorage.getItem("date") || "");
    $("#time").val(sessionStorage.getItem("time") || "");
    $("#guest").val(sessionStorage.getItem("guest") || "");
    $("#notes").val(sessionStorage.getItem("notes") || "");
    $("#confirmForm").hide();
    $("#alertSuccess").hide();
  });
// sessionStorage.getItem("name");
  // Save to sessionStorage when form is submitted
  $("#userForm").on("submit", function (e) {
    e.preventDefault();

    sessionStorage.setItem("name", $("#name").val());
    sessionStorage.setItem("email", $("#email").val());
    sessionStorage.setItem("phone", $("#phone").val());
    sessionStorage.setItem("date", $("#date").val());
    sessionStorage.setItem("time", $("#time").val());
    sessionStorage.setItem("guest", $("#guest").val());
    sessionStorage.setItem("notes", $("#notes").val());
    // $("#userForm").hide();
    // $("#confirmForm").show();

    document.getElementById("myFullName").textContent =
      sessionStorage.getItem("name");
    document.getElementById("myEmail").textContent =
      sessionStorage.getItem("email");
    document.getElementById("myPhone").textContent =
      sessionStorage.getItem("phone");
    document.getElementById("myDate").textContent =
      sessionStorage.getItem("date");
    document.getElementById("myTime").textContent =
      sessionStorage.getItem("time");
    document.getElementById("myGuest").textContent =
      sessionStorage.getItem("guest");
    document.getElementById("myNotes").textContent =
      sessionStorage.getItem("notes");
    $("#alertSuccess").show();
  });

  // Clear sessionStorage + form
  $("#clear").on("click", function () {
    sessionStorage.clear();
    $("#userForm")[0].reset();
    // $("#userForm").hide();
    // $("#confirmForm").show();
  });

    $("#clear_confirm").on("click", function () {
    $("#userForm").show();
    $("#confirmForm").hide();
  });
</script>
